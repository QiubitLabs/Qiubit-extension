<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qiubit Wallet - Welcome</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0B0C10;
            --bg-surface: rgba(22, 26, 37, 0.65);
            --bg-surface-solid: #171A26;
            --bg-hover: rgba(35, 41, 58, 0.85);
            
            --primary: #6366f1;
            --primary-gradient: linear-gradient(135deg, #4f46e5, #7c3aed);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.15);
            
            --text-primary: #F8FAFC;
            --text-secondary: #94A3B8;
            --text-muted: #64748B;
            
            --font-sans: 'Outfit', sans-serif;
            
            --wallet-width: 375px;
            --wallet-height: 600px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #030406;
            font-family: var(--font-sans);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(79, 70, 229, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(124, 58, 237, 0.08) 0%, transparent 40%);
        }

        /* Container that represents the Chrome Extension view */
        .wallet-container {
            width: var(--wallet-width);
            height: var(--wallet-height);
            background-color: var(--bg-base);
            border: 1px solid var(--border-subtle);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-image: linear-gradient(180deg, rgba(23, 26, 38, 0.4) 0%, rgba(11, 12, 16, 0.95) 100%);
        }

        .screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 32px 24px;
            align-items: center;
            justify-content: space-between;
            animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .brand-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-top: 24px;
        }

        .logo-container {
            width: 72px;
            height: 72px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            position: relative;
            transition: all 0.3s ease;
        }

        .logo-container::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 20px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.4), rgba(124, 58, 237, 0.1));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .logo-svg {
            width: 38px;
            height: 38px;
            fill: none;
            stroke: #F8FAFC;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .logo-text {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #F8FAFC 30%, #94A3B8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 400;
            line-height: 1.5;
            max-width: 260px;
        }

        .features-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin: 32px 0;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            transition: all 0.2s ease;
        }

        .feature-item:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: var(--border-hover);
            transform: translateY(-1px);
        }

        .feature-icon-wrapper {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            background: rgba(99, 102, 241, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #818cf8;
        }

        .feature-details {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .feature-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .feature-desc {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 1px;
        }

        .action-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 8px;
        }

        .btn {
            width: 100%;
            height: 48px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            border: none;
            gap: 8px;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--primary-gradient);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
        }

        .btn-primary:hover {
            opacity: 0.95;
            transform: translateY(-1.5px);
            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.3);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--border-hover);
            transform: translateY(-1.5px);
        }

        .btn-secondary:active {
            transform: translateY(0);
        }

        .footer-text {
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
            margin-top: 12px;
        }

        .footer-text span {
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* SVG Icons */
        .icon-svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }
    </style>
</head>
<body>

    <div class="wallet-container">
        <div class="screen">
            
            <div class="brand-section">
                <div class="logo-container">
                    <svg class="logo-svg" viewBox="0 0 24 24">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
                    </svg>
                </div>
                <h1 class="logo-text">Qiubit</h1>
                <p class="subtitle">Securely manage your digital assets across multiple networks.</p>
            </div>

            <div class="features-list">
                <div class="feature-item">
                    <div class="feature-icon-wrapper">
                        <svg class="icon-svg" viewBox="0 0 24 24">
                            <rect x="2" y="5" width="20" height="14" rx="2" ry="2" />
                            <line x1="2" y1="10" x2="22" y2="10" />
                        </svg>
                    </div>
                    <div class="feature-details">
                        <span class="feature-title">Multi-Chain Vault</span>
                        <span class="feature-desc">EVM, Sui, Solana & Bitcoin combined</span>
                    </div>
                </div>

                <div class="feature-item">
                    <div class="feature-icon-wrapper">
                        <svg class="icon-svg" viewBox="0 0 24 24">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                        </svg>
                    </div>
                    <div class="feature-details">
                        <span class="feature-title">OCS01 Privacy Shield</span>
                        <span class="feature-desc">Encrypted anonymous shielding protocol</span>
                    </div>
                </div>

                <div class="feature-item">
                    <div class="feature-icon-wrapper">
                        <svg class="icon-svg" viewBox="0 0 24 24">
                            <polyline points="16 3 21 3 21 8" />
                            <line x1="4" y1="20" x2="21" y2="3" />
                            <polyline points="21 16 21 21 16 21" />
                            <line x1="15" y1="15" x2="21" y2="21" />
                            <line x1="4" y1="4" x2="9" y2="9" />
                        </svg>
                    </div>
                    <div class="feature-details">
                        <span class="feature-title">Instant Hybrid Exchange</span>
                        <span class="feature-desc">Cross-chain swap with optimal slippage</span>
                    </div>
                </div>
            </div>

            <div class="action-section">
                <button class="btn btn-primary" onclick="navigateTo('ui_create_wallet.html')">
                    Create New Wallet
                    <svg class="icon-svg" viewBox="0 0 24 24">
                        <line x1="5" y1="12" x2="19" y2="12" />
                        <polyline points="12 5 19 12 12 19" />
                    </svg>
                </button>
                <button class="btn btn-secondary" onclick="navigateTo('ui_create_wallet.html?mode=import')">
                    Import Wallet
                </button>
                <div class="footer-text">
                    Supported by <span>Octra Network</span>
                </div>
            </div>

        </div>
    </div>

    <script>
        function navigateTo(url) {
            document.querySelector('.screen').style.opacity = '0';
            document.querySelector('.screen').style.transform = 'translateY(-10px)';
            document.querySelector('.screen').style.transition = 'all 0.3s ease';
            setTimeout(() => {
                window.location.href = url;
            }, 300);
        }
    </script>
</body>
</html>
